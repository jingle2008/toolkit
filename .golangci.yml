version: "2"
# golangci-lint configuration (schema v2)
# - paralleltest: enforces t.Parallel() in tests; use //nolint:paralleltest with justification for serial tests
# See CONTRIBUTING.md for test best practices.

run:
  timeout: 3m
  build-tags:
    - integration

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - gocognit
    - ineffassign
    - misspell
    - wastedassign
    - paralleltest
    - gocritic
    - gosec
    - contextcheck
    - unused
    - dupl
    - nilnil
    - prealloc
    - unparam
    - dogsled
    - bodyclose
    - cyclop
    - errorlint
    - containedctx
    - whitespace
    - exhaustive
    - forcetypeassert
    - nolintlint
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
    cyclop:
      max-complexity: 13
    prealloc:
      simple: true
    revive:
      severity: warning
  exclusions:
    rules:
      # A failed type assertion in a test panics, which already fails it.
      - path: _test\.go
        linters:
          - forcetypeassert
