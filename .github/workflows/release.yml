name: Release

on:
  push:
    tags:
      - "v*"

# Read-only token by default; the goreleaser job widens it below.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tags are mutable);
# the trailing # vX.Y.Z comment is what Dependabot reads and bumps. This
# workflow holds the signing and notarization secrets, so a moved tag
# here would be the expensive kind of supply-chain incident.
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # GoReleaser creates the GitHub release and uploads its assets.
      # (It authenticates with secrets.GH_TOKEN below, a PAT that can also
      # push to homebrew-tap; this grant covers the built-in token.)
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from the commits since the
          # previous tag; a shallow clone has neither, so the release
          # notes came out empty (v0.12.0, v0.13.0).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Import GPG private key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Set GPG trust
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub/ {print $5; exit}')
          echo "$KEY_ID:6:" | gpg --import-ownertrust

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"  # or 'latest' once you confirm it's v2+
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # macOS Developer ID code-signing + notarytool submission.
          # All five must be set for the notarize step to run; missing
          # any one disables it (see .goreleaser.yaml `notarize:` and
          # docs/release/macos-notarization.md for the setup checklist).
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
